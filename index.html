<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lay Lay — 시뮬 레이아웃</title>
<meta name="theme-color" content="#1a1612">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    background: #1a1612;
    color: #f3ede6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .shell-top { flex-shrink: 0; }
  .shell-head {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px 12px;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(12,10,9,.94);
    backdrop-filter: blur(10px);
  }
  .shell-brand {
    font-size: 12px;
    font-weight: 700;
    color: rgba(243,237,230,.55);
    letter-spacing: .02em;
  }
  .tabs {
    display: flex;
    gap: 6px;
    max-width: 100%;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tab {
    appearance: none;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05);
    color: rgba(243,237,230,.82);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .tab:hover {
    background: rgba(255,255,255,.1);
    border-color: rgba(255,255,255,.18);
  }
  .tab[aria-selected="true"] {
    background: #e8440a;
    border-color: #e85925;
    color: #fff;
  }

  .split {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
    overflow: hidden;
  }

  /* 좌측: AI 설정 */
  .dev-rail {
    flex-shrink: 0;
    width: min(280px, 38vw);
    border-right: 1px solid rgba(255,255,255,.1);
    background: rgba(10, 9, 8, .96);
    overflow: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .dev-rail-caption {
    font-size: 10px;
    font-weight: 600;
    color: rgba(243,237,230,.42);
    letter-spacing: .03em;
    line-height: 1.35;
  }

  .dev-field label {
    display: block;
    font-size: 10px;
    font-weight: 500;
    color: rgba(243,237,230,.46);
    margin-bottom: 2px;
    letter-spacing: .02em;
  }
  .dev-input, .dev-select {
    width: 100%;
    font-family: inherit;
    font-size: 11.5px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(0,0,0,.38);
    color: #f3ede6;
    padding: 5px 7px;
  }
  .dev-sim-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 6px 8px;
    border-radius: 6px;
    background: rgba(232,68,10,.22);
    color: rgba(254,237,230,.96);
    text-align: center;
  }
  .dev-hint {
    font-size: 9px;
    color: rgba(243,237,230,.4);
    line-height: 1.45;
  }
  .dev-runtime {
    font-size: 10px;
    color: rgba(255,255,255,.9);
    background: rgba(51, 65, 85, .28);
    border: 1px solid rgba(148, 163, 184, .28);
    border-radius: 6px;
    padding: 7px;
    line-height: 1.45;
  }
  .dev-mode {
    font-size: 10px;
    color: rgba(125, 211, 252, .95);
    background: rgba(14, 116, 144, .22);
    border: 1px solid rgba(125, 211, 252, .28);
    border-radius: 6px;
    padding: 6px 7px;
    line-height: 1.35;
  }

  .frame-wrap {
    flex: 1;
    min-width: 0;
    position: relative;
    background: #0d0c0b;
  }
  .frame-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* 우측: AI 담당 영역 맵 */
  .cov-rail {
    flex-shrink: 0;
    width: min(300px, 40vw);
    border-left: 1px solid rgba(255,255,255,.1);
    background: rgba(8, 14, 18, .96);
    overflow: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cov-rail-caption {
    font-size: 10px;
    font-weight: 600;
    color: rgba(163, 211, 232, .55);
    letter-spacing: .03em;
    line-height: 1.35;
  }
  .cov-list { display: flex; flex-direction: column; gap: 6px; }
  .cov-row {
    text-align: left;
    width: 100%;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(0,0,0,.28);
    color: #e8f0f4;
    font-family: inherit;
    padding: 8px 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .cov-row:hover {
    border-color: rgba(255,255,255,.2);
    background: rgba(255,255,255,.06);
  }
  .cov-row[aria-pressed="true"] {
    box-shadow: 0 0 0 1px rgba(125, 211, 252, .35);
    border-color: rgba(125, 211, 252, .4);
    background: rgba(14, 116, 144, .18);
  }
  .cov-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 2px;
  }
  .cov-label { font-size: 12px; font-weight: 600; line-height: 1.35; color: #f3ede6; }
  .cov-badge {
    flex-shrink: 0;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .04em;
    padding: 3px 7px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .cov-badge.ai { background: rgba(34, 197, 94, .22); color: #86efac; border: 1px solid rgba(34,197,94,.35); }
  .cov-badge.fixed { background: rgba(148, 163, 184, .15); color: rgba(226,232,240,.85); border: 1px solid rgba(148,163,184,.28); }
  .cov-sub { font-size: 10px; color: rgba(234,240,245,.45); line-height: 1.4; margin-top: 2px; }
  .cov-detail {
    font-size: 10px;
    color: rgba(226, 240, 245, .82);
    line-height: 1.55;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid rgba(125, 211, 252, .22);
    background: rgba(14, 45, 58, .35);
    min-height: 2.5em;
  }
  .cov-detail.muted {
    border-color: rgba(255,255,255,.08);
    background: rgba(0,0,0,.2);
    color: rgba(243,237,230,.38);
  }

  @media (max-width: 720px) {
    .split { flex-direction: column; }
    .dev-rail {
      width: 100%;
      max-height: 30vh;
      border-right: none;
      border-bottom: 1px solid rgba(255,255,255,.08);
      flex-shrink: 0;
    }
    .cov-rail {
      width: 100%;
      max-height: 34vh;
      border-left: none;
      border-top: 1px solid rgba(255,255,255,.08);
      flex-shrink: 0;
    }
    .frame-wrap { min-height: 42vh; flex: 1; }
  }
</style>
</head>
<body>
  <div class="shell-top">
    <header class="shell-head">
      <span class="shell-brand">시뮬 전환</span>
      <div class="tabs" role="tablist" aria-label="시뮬 선택">
        <button type="button" class="tab" role="tab" id="tab-layz" aria-selected="true" aria-controls="panel-sim">Lay-Z력 테스트</button>
        <button type="button" class="tab" role="tab" id="tab-mong" aria-selected="false" aria-controls="panel-sim">Lay-몽</button>
      </div>
    </header>
  </div>

  <div class="split">
    <aside class="dev-rail" id="dev-rail" aria-label="AI 설정">
      <p class="dev-rail-caption">좌측: 모델 등 AI 설정 · 가운데: 시뮬 · 우측: AI 담당 맵</p>
      <div class="dev-mode" id="dev-mode-msg"></div>
      <div class="dev-sim-pill" id="dev-active-sim">지금 보는 시뮬: Lay-Z력 테스트</div>
      <p class="dev-hint">키 입력은 제거했습니다. 모델만 선택해서 테스트하세요.<br>동작 기준은 서버 환경변수 <code>OPENAI_API_KEY</code> 입니다.</p>
      <div class="dev-runtime" id="dev-runtime-box">런타임 대기 중…</div>
      <div class="dev-field">
        <label for="dev-model-preset">모델</label>
        <select class="dev-select" id="dev-model-preset" aria-label="모델">
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="gpt-4o">gpt-4o</option>
          <option value="gpt-4-turbo">gpt-4-turbo</option>
          <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
          <option value="o4-mini">o4-mini</option>
          <option value="o3-mini">o3-mini</option>
          <option value="o3">o3</option>
          <option value="__custom__">직접 입력…</option>
        </select>
      </div>
      <div class="dev-field" id="dev-model-custom-wrap" style="display:none">
        <label for="dev-model-custom">모델 ID</label>
        <input type="text" class="dev-input" id="dev-model-custom" placeholder="예: gpt-4o" spellcheck="false">
      </div>
    </aside>

    <div class="frame-wrap" role="tabpanel" id="panel-sim">
      <iframe id="sim-frame" title="선택한 시뮬" src="3차_시뮬_layz_test.html"></iframe>
    </div>

    <aside class="cov-rail" id="cov-rail" aria-label="AI 담당 영역">
      <p class="cov-rail-caption">AI 담당 영역</p>
      <p class="dev-hint" style="color: rgba(163,211,232,.42)">항목을 누르면 설명이 뜨고, 시뮬 화면에서 해당 구역이 붉게 깜빡여요.</p>
      <div class="cov-list" id="cov-list"></div>
      <div class="cov-detail muted" id="cov-detail">항목을 선택하면 상세 설명이 여기 표시됩니다.</div>
    </aside>
  </div>

  <script>
    (function () {
      var srcs = {
        layz: '3차_시뮬_layz_test.html',
        mong: '3차_시뮬_꿈해몽_산하.html',
      };
      var frame = document.getElementById('sim-frame');
      var tabs = [
        { el: document.getElementById('tab-layz'), key: 'layz' },
        { el: document.getElementById('tab-mong'), key: 'mong' },
      ];

      var modeMsg = document.getElementById('dev-mode-msg');
      var runtimeBox = document.getElementById('dev-runtime-box');
      var selPreset = document.getElementById('dev-model-preset');
      var wrapCustom = document.getElementById('dev-model-custom-wrap');
      var inputCustom = document.getElementById('dev-model-custom');
      var covList = document.getElementById('cov-list');
      var covDetail = document.getElementById('cov-detail');

      /** 시뮬별: 화면 구역이 AI 생성인지 / 고정·규칙인지 검수용 */
      var COVERAGE_BY_SIM = {
        layz: [
          {
            id: 'layz-q',
            label: '8문항 질문·보기',
            ai: false,
            short: '사전 작성 Q/A',
            detail: '모든 문항과 선택지는 HTML에 박힌 데이터(Qs 배열)입니다. 사용자가 고른 보기만 모이고, 모델 호출은 없습니다.',
          },
          {
            id: 'layz-score',
            label: 'Lay-Z 점수(숫자·링)',
            ai: false,
            short: '클라이언트만 (백엔드 동일 규칙 예정)',
            detail: '0~99 지수는 Qs 답변 가중치로만 계산합니다. 링·막대·배지 색은 점수 구간에 매핑된 TIERS 디자인 토큰입니다. 같은 카드 안의 티어명·한줄·본문은 결과 진입 후 AI가 덮어쓸 수 있으며, 실패 시 TIERS 고정 카피가 남습니다.',
          },
          {
            id: 'layz-rec',
            label: '추천·수면 처방 카피',
            ai: true,
            short: 'POST /api/openai-dev',
            detail: '결과 화면에서 `fetchLayZCopy`가 `/api/openai-dev`를 호출해 tierName·tierTag·head·desc·recs(3)·rx(JSON)를 생성합니다. Lay-몽과 동일하게 셸 `laylay-dev-sync` + `laylayEffectiveApiKey`/`laylayEffectiveModel`을 씁니다. 실패·파싱 오류 시 TIERS 템플릿으로 폴백합니다.',
          },
          {
            id: 'layz-share',
            label: '공유 카드(캔버스)',
            ai: true,
            short: 'Canvas + AI 반영 카피',
            detail: 'Canvas 레이아웃·이미지 합성은 고정입니다. 그려 넣는 티어 이름·태그·헤드 등은 `st.lzTierForShare`(AI 병합본)가 있으면 우선 사용합니다.',
          },
          {
            id: 'layz-api',
            label: 'OpenAI / 런타임',
            ai: true,
            short: 'Lay-Z 결과 카피 호출',
            detail: 'Lay-Z 결과 본문·추천·수면 문구는 iframe에서 `POST /api/openai-dev`로 생성합니다. 모델·키는 개발 셸과 동기화됩니다.',
          },
        ],
        mong: [
          {
            id: 'mong-form',
            label: '입력 폼·무드·달력 UI',
            ai: false,
            short: '고정 UI',
            detail: '생년월일·꿈 입력 등은 마크업·스타일로 고정입니다. AI는 이 값을 읽어 프롬프트에 넣을 뿐, 폼 자체를 생성하지 않습니다.',
          },
          {
            id: 'mong-score',
            label: '종합 점수·링 그래프',
            ai: true,
            short: 'JSON 별점 합산',
            detail: '재물·애정·직장·건강 별 개수로 총점과 링을 그립니다. 값 자체는 모델이 준 JSON 필드입니다.',
          },
          {
            id: 'mong-oneline',
            label: '한줄평',
            ai: true,
            short: '한줄평 필드',
            detail: '`한줄평` 문자열을 그대로 표시합니다.',
          },
          {
            id: 'mong-fortune',
            label: '운세 분석 카드',
            ai: true,
            short: '분야별·총론 텍스트',
            detail: '각 운 설명·총론 설명 문단은 모델 JSON입니다. 접기 UI만 고정입니다.',
          },
          {
            id: 'mong-lucky',
            label: '행운의 색·숫자·물건',
            ai: true,
            short: '행운 3요소',
            detail: '`행운의색`, `행운의숫자`, `행운의물건` 필드를 카드에 넣습니다.',
          },
          {
            id: 'mong-tags',
            label: '행동 해시태그',
            ai: true,
            short: '`행동해시태그` 배열',
            detail: '모델이 준 해시태그 문자열을 칩으로 렌더합니다.',
          },
          {
            id: 'mong-mock',
            label: 'API 실패·파싱 실패 시',
            ai: false,
            short: 'MOCK 폴백',
            detail: '오류나 JSON 깨짐 시 MOCK 상수로 위 필드를 채웁니다. 강조는 본문 양이 많은 운세 카드 영역을 대표로 보여 줍니다.',
          },
          {
            id: 'mong-ui',
            label: '결과 레이아웃·탭·무드 뱃지',
            ai: false,
            short: '템플릿 렌더',
            detail: '탭, 접기 아이콘, 공유/재시도 버튼, 선택한 기분 뱃지 등은 고정 UI입니다.',
          },
          {
            id: 'mong-feed',
            label: '도감 피드·시드 데이터',
            ai: false,
            short: 'localStorage 규칙',
            detail: '피드에 쌓이는 예시 항목과 저장 로직은 클라이언트 규칙입니다. AI가 피드 문구를 따로 쓰지는 않습니다.',
          },
        ],
      };

      function renderCoverage(simKey) {
        var rows = COVERAGE_BY_SIM[simKey] || [];
        covList.innerHTML = '';
        covDetail.textContent = '항목을 선택하면 상세 설명이 여기 표시됩니다.';
        covDetail.classList.add('muted');
        rows.forEach(function (row) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cov-row';
          btn.setAttribute('aria-pressed', 'false');
          var badgeClass = row.ai ? 'cov-badge ai' : 'cov-badge fixed';
          var badgeText = row.ai ? 'AI' : '고정';
          btn.innerHTML =
            '<div class="cov-row-top">' +
            '<span class="cov-label">' +
            row.label +
            '</span>' +
            '<span class="' +
            badgeClass +
            '">' +
            badgeText +
            '</span></div>' +
            '<div class="cov-sub">' +
            row.short +
            '</div>';
          btn.addEventListener('click', function () {
            covList.querySelectorAll('.cov-row').forEach(function (r) {
              r.setAttribute('aria-pressed', 'false');
            });
            btn.setAttribute('aria-pressed', 'true');
            covDetail.classList.remove('muted');
            covDetail.textContent = row.detail;
            broadcastHighlight(row.id);
          });
          covList.appendChild(btn);
        });
      }

      function select(key) {
        frame.src = srcs[key];
        tabs.forEach(function (t) {
          var on = t.key === key;
          t.el.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        var simEl = document.getElementById('dev-active-sim');
        if (simEl)
          simEl.textContent =
            key === 'mong' ? '지금 보는 시뮬: Lay-몽' : '지금 보는 시뮬: Lay-Z력 테스트';
        if (key === 'layz') {
          runtimeBox.textContent = 'Lay-Z는 현재 API 호출 기능 미연동 (런타임 측정 없음)';
        } else {
          runtimeBox.textContent = 'Lay-몽 실행 시 런타임이 여기 표시됩니다.';
        }
        renderCoverage(key);
      }

      tabs[0].el.addEventListener('click', function () { select('layz'); });
      tabs[1].el.addEventListener('click', function () { select('mong'); });

      function syncCustomModelVisible() {
        wrapCustom.style.display = selPreset.value === '__custom__' ? 'block' : 'none';
      }
      selPreset.addEventListener('change', syncCustomModelVisible);
      syncCustomModelVisible();

      function resolvedModel() {
        if (selPreset.value === '__custom__')
          return (inputCustom.value || '').trim() || 'gpt-4o-mini';
        return selPreset.value;
      }

      function pushModelToShellSession() {
        try {
          sessionStorage.setItem('laylay_dev_openai_model', resolvedModel());
        } catch (e) {}
      }

      /** iframe에 현재 패널 키·모델을 반드시 넣어야 MOCK으로 안 떨어집니다(localStorage 분리 문제 방지). */
      function broadcastDevToFrame() {
        if (!frame.contentWindow) return;
        pushModelToShellSession();
        try {
          frame.contentWindow.postMessage(
            {
              source: 'laylay-shell',
              type: 'laylay-dev-sync',
              apiKey: '',
              model: resolvedModel(),
            },
            '*'
          );
        } catch (e) {}
      }

      /** 우측 대시보드에서 선택한 구역을 iframe 안에서 붉게 깜빡임 */
      function broadcastHighlight(regionId) {
        if (regionId === 'mong-mock') regionId = 'mong-fortune';
        if (!frame.contentWindow || !regionId) return;
        try {
          frame.contentWindow.postMessage(
            {
              source: 'laylay-shell',
              type: 'laylay-highlight',
              regionId: regionId,
            },
            '*'
          );
        } catch (e) {}
      }

      selPreset.addEventListener('change', function () {
        pushModelToShellSession();
        broadcastDevToFrame();
      });
      inputCustom.addEventListener('change', function () {
        pushModelToShellSession();
        broadcastDevToFrame();
      });
      inputCustom.addEventListener('blur', function () {
        pushModelToShellSession();
        broadcastDevToFrame();
      });

      frame.addEventListener('load', function () {
        broadcastDevToFrame();
      });

      pushModelToShellSession();

      function updateModeGuide() {
        var h = location.hostname || '';
        var isLocal = h === 'localhost' || h === '127.0.0.1' || h === '';
        if (isLocal) {
          modeMsg.innerHTML =
            '테스트 환경으로 보입니다.<br>서버 OPENAI_API_KEY가 없으면 Mock으로 동작합니다.';
        } else {
          modeMsg.innerHTML =
            '실배포 환경으로 보입니다.<br>서버 OPENAI_API_KEY가 설정돼 있으면 키 입력 없이 모델만 선택해도 됩니다.';
        }
      }

      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.source !== 'laylay-sim' || d.type !== 'runtime') return;
        var ms = typeof d.elapsed_ms === 'number' ? d.elapsed_ms + 'ms' : '-';
        var status = d.status || 'unknown';
        var detail = d.detail ? ' / ' + d.detail : '';
        runtimeBox.textContent = '[' + (d.sim || 'sim') + '] ' + ms + ' · ' + status + detail;
      });

      updateModeGuide();
      select('layz');
      broadcastDevToFrame();
    })();
  </script>
</body>
</html>
